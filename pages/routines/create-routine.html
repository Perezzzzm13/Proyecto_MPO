<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear rutina - GymTracker</title>

    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/base/global.css">
    <link rel="stylesheet" href="../../css/components/buttons.css">
    <link rel="stylesheet" href="../../css/components/forms.css">
    <link rel="stylesheet" href="../../css/components/messages.css">
    <link rel="stylesheet" href="../../css/pages/routines.css">
</head>
<body>
    <main>
        <h1>Crear rutina</h1>

        <form id="form-crear-rutina">
            <div class="campo-formulario">
                <label for="nombre">Nombre de la rutina</label>
                <input type="text" id="nombre" name="nombre" maxlength="50" required>
            </div>
        
            <div class="campo-formulario">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" maxlength="255" rows="4"></textarea>
            </div>
        
            <div id="mensaje-rutina"></div>
        
            <div class="acciones-formulario">
                <button type="submit" class="btn btn-primary">Guardar rutina</button>
                <a href="routines.html" class="btn">Volver</a>
            </div>
        </form>
    </main>

    <script src="../../js/routines/routines-create.js"></script>
</body>
</html>
